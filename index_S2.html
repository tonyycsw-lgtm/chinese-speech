<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>詩詞朗讀｜朗讀練習（無障礙版）</title>

<link rel="icon" type="image/png" href="icon-s2-192.png" />
<link rel="manifest" href="manifest_s2.json" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
/* 全頁不可選取文字：頁面與按鈕只可點擊，長按不彈瀏覽器選單 */
* {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

/* ============================================================
   一般模式（預設）
   ============================================================ */
:root {
  --base-font-size: 36px;
  --bg: #0a0a12;
  --text: #ffffff;
  --pinyin: #4fc3f7;
  --highlight-bg: #2b2b00;
  --highlight-hanzi: #ffffff;
  --highlight-pinyin: #4fc3f7;
  --btn-bg: #222831;
  --btn-hover: #393e46;
  --btn-min: 48px;
  --btn-radius: 10px;
  --focus-ring: #ffff00;
  --line-height: 2.4;
  --icon-size: 24px;

  /* 錄音按鈕位置（水平置中） */
  --fab-bottom: calc(90px + env(safe-area-inset-bottom));
  --fab-size: 54px;
}

/* ============================================================
   無障礙模式
   ============================================================ */
body.a11y-mode {
  --bg: #000000;
  --text: #FFFFFF;
  --pinyin: #00FFCC;
  --highlight-bg: #FFFF00;
  --highlight-hanzi: #000000;
  --highlight-pinyin: #FF0000;
  --btn-min: 80px;
  --btn-radius: 16px;
  --line-height: 2.6;
  --icon-size: 32px;

  --fab-bottom: calc(max(140px, 20vh) + 14px + env(safe-area-inset-bottom));
  --fab-size: 88px;
}

@media (prefers-reduced-motion: reduce) {
  .sentence-active { transform: none !important; transition: none !important; }
  .record-fab.playing-back .wave-bar { animation: none !important; }
  * { animation: none !important; transition: none !important; }
}

* { box-sizing: border-box; cursor: default; }
button { cursor: pointer; }

html {
  margin: 0;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: auto;
  overflow-y: auto;
  padding: 0;
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* 觸控裝置（手機／平板）：多留 80px 可滾動空間，上推頁面即收合瀏覽器網址欄；
   控制列為 sticky 貼底，滾動時不移動；頂欄滾出、文字窗上擴 */
@media (hover: none) and (pointer: coarse) {
  body {
    min-height: calc(100dvh + 80px);
  }
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}

/* ============================================================
   頂部工具列
   ============================================================ */
.top-setting-bar {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  align-items: center;
  padding: 8px 16px;
  background: var(--bg);
  border-bottom: 2px solid #222;
  min-height: 56px;
}

body.a11y-mode .top-setting-bar {
  height: auto;
  min-height: 64px;
  padding: 8px 16px;
}

.top-setting-bar h1 {
  margin: 0;
  font-size: 18px;
  white-space: nowrap;
}


.mode-btn {
  min-width: var(--btn-min);
  min-height: var(--btn-min);
  padding: 8px 14px;
  font-size: 20px;
  font-weight: bold;
  border: 2px solid #00FFCC;
  border-radius: var(--btn-radius);
  background: var(--btn-bg);
  color: #FFFFFF;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

body.a11y-mode .mode-btn {
  min-width: 48px;
  min-height: 48px;
  font-size: 20px;
  border-width: 2px;
  border-radius: 10px;
}


.mode-btn[aria-pressed="true"] { background: #00FFCC; color: #000000; }
.mode-btn:focus-visible { outline: 4px solid var(--focus-ring); outline-offset: 3px; }

select {
  font-size: 15px;
  padding: 6px 10px;
  border-radius: 8px;
  background: #222;
  color: #fff;
  border: 1px solid #444;
}

/* ============================================================
   作品選擇列
   ============================================================ */
.poem-selector {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  align-items: center;
  padding: 8px 12px;
  background: var(--bg);
  border-bottom: 2px solid #222;
}

.poem-btn {
  min-width: 52px;
  min-height: 56px;
  padding: 8px 18px;
  font-size: 18px;
  font-weight: bold;
  border: 2px solid #00FFCC;
  border-radius: var(--btn-radius);
  background: var(--btn-bg);
  color: #FFFFFF;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
}

.poem-btn.active {
  background: #00FFCC;
  color: #000000;
}

.poem-btn:focus-visible {
  outline: 4px solid var(--focus-ring);
  outline-offset: 3px;
}

body.a11y-mode .poem-selector {
  gap: 12px;
  padding: 10px 12px;
}

body.a11y-mode .poem-btn {
  min-width: 72px;
  min-height: 64px;
  font-size: 20px;
  border-width: 3px;
}

/* ============================================================
   內容區
   ============================================================ */
.content-area {
  flex: 1;
  /* 保障文字窗口高度：使文檔總高 = 視口 + 頂欄 + 作品列，向上滑動時頂欄滾出、文字窗口從頂部開始 */
  min-height: var(--content-min-h, 480px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  max-width: 100%;
  overflow: visible;
  padding: 20px;
  /* 錄音鈕已移入底部控制列，文字窗不再預留懸浮帶，空間全部給詩句 */
  padding-bottom: 24px;
  margin: 0;
  background: var(--bg);
  border-top: 2px dashed #333;
  border-bottom: 2px dashed #333;
  resize: vertical;
  position: relative;
  touch-action: auto;
}

@media (min-width: 768px) {
  .content-area {
    max-width: 900px;
    margin: 0 auto;
    border-left: 2px dashed #333;
    border-right: 2px dashed #333;
    border-radius: 12px;
  }
}

.content-area::after {
  content: "⇕";
  position: absolute;
  right: 6px;
  bottom: 4px;
  font-size: 14px;
  color: #666;
  pointer-events: none;
}

body.a11y-mode .content-area::after { display: none; }

/* ============================================================
   字卡排版
   ============================================================ */
.sentence-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  max-width: 100%;
  min-height: 0;
  flex: 1;
}

.poem-head {
  flex-shrink: 0;
  margin-top: 28px;
  margin-bottom: 40px;
  font-size: 21px;
  color: #90a0b8;
  letter-spacing: 1px;
  white-space: nowrap;
}

.poem-author {
  font-size: 0.78em;
  color: #5f6b7f;
  margin-left: 8px;
}

.para-holder {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* 詩句用 margin:auto 居中：空間不足（矮視口多行詩句）時自動頂部對齊，絕不向上壓住標題 */
}

body.a11y-mode .para-holder {
  /* 讓位改由 .content-area 的 --fab-zone 預留統一處理 */
  padding-bottom: 0;
}



body.a11y-mode .poem-head {
  margin-top: 36px;
  margin-bottom: 48px;
  font-size: 26px;
  color: #00FFCC;
}

body.a11y-mode .poem-author {
  color: #FFFFFF;
}

.para-wrap {
  text-align: center;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  gap: 0 4px;
  line-height: var(--line-height);
  padding: 16px;
  max-width: 100%;
  width: 100%;
  margin: auto;
}

.sentence-active {
  background: var(--highlight-bg);
  padding: 12px 16px;
  border-radius: 12px;
  box-shadow: 0 0 14px var(--highlight-bg);
}

body.a11y-mode .sentence-active {
  background: transparent;
  box-shadow: none;
  padding: 0;
}

ruby {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  /* 字卡等寬：每字固定寬度，令等字數句的文字起點完全一致 */
  width: 1.35em;
  margin: 0 2px;
  padding: 4px 0;
  font-size: var(--base-font-size);
  font-weight: bold;
  color: var(--text);
  word-break: keep-all;
  white-space: nowrap;
  flex-shrink: 0;
  vertical-align: baseline;
  line-height: 1.2;
  transform-origin: center bottom;
  transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
  position: relative;
  z-index: 1;
  user-select: none;
  -webkit-user-select: none;
}

rt {
  font-size: 0.48em;
  color: var(--pinyin);
  font-weight: normal;
  line-height: 1.4;
  white-space: nowrap;
  min-height: 1em;
}

ruby rt { visibility: hidden; }
ruby.show-pinyin rt,
ruby:hover rt,
ruby.reading-now rt,
ruby.pressing rt { visibility: visible; }

.punctuation {
  font-size: var(--base-font-size);
  font-weight: bold;
  color: var(--text);
  display: inline-flex;
  align-items: flex-end;
  justify-content: center;
  width: 1.35em;
  line-height: 1.2;
  margin: 0 2px;
  flex-shrink: 0;
  vertical-align: baseline;
  padding-bottom: 0.55em;
}

body.a11y-mode ruby.reading-now {
  background: var(--highlight-bg);
  color: var(--highlight-hanzi);
  box-shadow: 0 0 12px rgba(255,255,0,0.6);
  transform: scale(1.15);
  z-index: 5;
}

body.a11y-mode ruby.reading-now rt {
  color: var(--highlight-pinyin);
  font-weight: bold;
}

body.a11y-mode ruby.pressing {
  transform: scale(1.5);
  z-index: 10;
  box-shadow: 0 0 20px rgba(255,255,0,0.9);
  background: var(--highlight-bg);
  color: var(--highlight-hanzi);
}

body.a11y-mode ruby.pressing rt {
  color: var(--highlight-pinyin);
  font-weight: bold;
}

/* ============================================================
   底部控制列
   ============================================================ */
.control-bar {
  position: sticky;
  bottom: env(safe-area-inset-bottom, 0);
  z-index: 90;
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  align-items: center;
  padding: 8px 10px;
  background: var(--bg);
  border-top: 2px solid #222;
  min-height: 64px;
}

body.a11y-mode .control-bar {
  min-height: 140px;
  gap: 8px;
  padding: 8px 10px;
}

.nav-btn, .sm-btn, .play-btn, .speed-btn {
  min-width: var(--btn-min);
  min-height: var(--btn-min);
  padding: 6px;
  font-size: 14px;
  border: none;
  border-radius: var(--btn-radius);
  background: var(--btn-bg);
  color: white;
  flex-shrink: 0;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: background 0.15s ease;
}

body.a11y-mode .nav-btn,
body.a11y-mode .sm-btn,
body.a11y-mode .play-btn,
body.a11y-mode .speed-btn {
  border: 3px solid #00FFCC;
  font-size: 16px;
}

body.a11y-mode .voice-btn.voice-reciting {
  border: 4px solid #FFD54F;
  background: #1A237E;
  box-shadow: 0 0 0 2px #000 inset, 0 0 18px #FFD54F;
  transition: none;   /* 切到朗讀立即高亮，弱視學生即時可辨 */
}

.nav-btn:hover, .sm-btn:hover, .play-btn:hover, .speed-btn:hover {
  background: var(--btn-hover);
}

.nav-btn:focus-visible, .sm-btn:focus-visible,
.play-btn:focus-visible, .speed-btn:focus-visible {
  outline: 4px solid var(--focus-ring);
  outline-offset: 3px;
}

.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.play-btn.playing { background: #00695c; }

.icon {
  width: var(--icon-size);
  height: var(--icon-size);
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.btn-text {
  display: none;
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
}

body.a11y-mode .btn-text { display: inline-block; }

#speedVal {
  font-size: 12px;
  line-height: 1;
  color: #00FFCC;
  font-weight: bold;
  min-width: 28px;
  text-align: center;
}

body.a11y-mode #speedVal { font-size: 14px; }

.voice-name {
  font-size: 12px;
  line-height: 1;
  color: #00FFCC;
  font-weight: bold;
  min-width: 40px;
  text-align: center;
}

body.a11y-mode .voice-name { font-size: 16px; }

/* ============================================================
   浮動錄音按鈕
   ============================================================ */
.record-fab {
  /* 位於底部控制列內、音色按鈕右邊（不再懸浮，不遮文字） */
  position: static;
  width: var(--fab-size);
  height: var(--fab-size);
  border-radius: 50%;
  border: 4px solid #FF6B6B;
  background: #2a1a1a;
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, opacity 0.15s ease;
  touch-action: none;
}

.record-fab:hover {
  background: #3a2020;
}

.record-fab:focus-visible {
  outline: 4px solid var(--focus-ring);
  outline-offset: 3px;
}

.record-fab.recording {
  background: #ff3b30;
  border-color: #ffd0c8;
  transform: scale(1.18);
  box-shadow: 0 0 30px rgba(255, 59, 48, 0.8);
  animation: fab-breathe 1.1s ease-in-out infinite;
}

@keyframes fab-breathe {
  0%, 100% { transform: scale(1.18); }
  50% { transform: scale(1.34); }
}

.record-fab.playing-back {
  background: #00695c;
  border-color: #00FFCC;
}

.record-fab .fab-icon {
  width: 42px;
  height: 42px;
  stroke: currentColor;
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ============================================================
   聲波動畫（播放錄音時狀態圖示）
   ============================================================ */
.wave-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 42px;
}

.wave-bar {
  width: 4px;
  height: 12px;
  background: #FFFFFF;
  border-radius: 2px;
  animation: wave 1s ease-in-out infinite;
}

.wave-bar:nth-child(1) { animation-delay: 0s; }
.wave-bar:nth-child(2) { animation-delay: 0.15s; }
.wave-bar:nth-child(3) { animation-delay: 0.3s; }
.wave-bar:nth-child(4) { animation-delay: 0.45s; }
.wave-bar:nth-child(5) { animation-delay: 0.6s; }

@keyframes wave {
  0%, 100% { height: 12px; opacity: 0.6; }
  50% { height: 36px; opacity: 1; }
}

body.a11y-mode .wave-container { height: 54px; }
body.a11y-mode .wave-bar { width: 5px; height: 14px; }

@keyframes wave-a11y {
  0%, 100% { height: 14px; opacity: 0.6; }
  50% { height: 44px; opacity: 1; }
}

body.a11y-mode .wave-bar { animation-name: wave-a11y; }

/* ============================================================
   音量柱（錄音時即時音量，多色：綠→黃→紅）
   ============================================================ */
.volume-meter {
  /* 錄音鈕右邊的垂直音量柱（錄音時顯示） */
  position: static;
  width: 16px;
  height: var(--fab-size);
  display: flex;
  flex-direction: column-reverse;
  gap: 2px;
  padding: 3px;
  border: 2px solid #4a4a58;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  flex-shrink: 0;
}

.vol-seg {
  flex: 1;
  width: 100%;
  border-radius: 2px;
  background: rgba(255,255,255,0.16);
  transition: background 0.08s linear, box-shadow 0.08s linear;
}

.vol-seg:nth-child(-n+4) { --seg-color: #00ffa3; }
.vol-seg:nth-child(n+5):nth-child(-n+7) { --seg-color: #ffd94d; }
.vol-seg:nth-child(n+8) { --seg-color: #ff4757; }

.volume-meter.active .vol-seg { background: rgba(255,255,255,0.30); }

.vol-seg.on {
  background: var(--seg-color, #00ffa3);
  box-shadow: 0 0 12px var(--seg-color, #00ffa3), 0 0 4px rgba(255,255,255,0.55);
}

body.a11y-mode .volume-meter {
  width: 20px;
}

body.a11y-mode .record-fab .fab-icon { width: 54px; height: 54px; }

/* 可見提示橫幅（錯誤／權限指引），大字形、高對比、自動消失 */
.mic-toast {
  position: fixed;
  left: 50%;
  bottom: 18%;
  transform: translateX(-50%);
  max-width: 88%;
  padding: 16px 22px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.88);
  color: #fff;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.5;
  text-align: center;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
}
.mic-toast.show { opacity: 1; }
body.a11y-mode .mic-toast { font-size: 28px; }
</style>
</head>
<body>

<div aria-live="polite" class="sr-only" id="a11y-status"></div>
<div class="mic-toast" id="micToast" role="alert"></div>

<header class="top-setting-bar">
  <h1>詩詞朗讀｜朗讀練習</h1>

    <button class="mode-btn" id="modeToggle" aria-pressed="false"
          onclick="toggleA11yMode()" aria-label="切換至無障礙模式">
    <span id="modeBtnText">B</span>
  </button>
</header>

<!-- 作品選擇列 -->
<div class="poem-selector" role="group" aria-label="選擇作品">
  <button class="poem-btn" id="poemBtn0" onclick="selectPoem(0)" aria-pressed="false" aria-label="水仙子・尋梅">1</button>
  <button class="poem-btn" id="poemBtn1" onclick="selectPoem(1)" aria-pressed="false" aria-label="春夜喜雨">2</button>
  <button class="poem-btn" id="poemBtn2" onclick="selectPoem(2)" aria-pressed="false" aria-label="聽雪">3</button>
</div>

<main class="content-area" id="textContainer" role="region" aria-label="朗讀文字內容"></main>

<nav class="control-bar" role="navigation" aria-label="朗讀控制">

  <button class="nav-btn" id="prevBtn" onclick="prevSentence()" aria-label="上一句">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m15 18-6-6 6-6"/>
    </svg>
    <span class="btn-text">上句</span>
  </button>

  <button class="play-btn" id="playBtn" onclick="togglePlayAudio()" aria-label="播放">
    <svg class="icon" id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
      <polygon points="6 3 20 12 6 21 6 3"/>
    </svg>
    <svg class="icon" id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" style="display:none;">
      <rect x="6" y="4" width="4" height="16"/>
      <rect x="14" y="4" width="4" height="16"/>
    </svg>
    <span class="btn-text">播放</span>
  </button>

  <button class="nav-btn" id="nextBtn" onclick="nextSentence()" aria-label="下一句">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m9 18 6-6-6-6"/>
    </svg>
    <span class="btn-text">下句</span>
  </button>

  <button class="speed-btn" id="speedBtn" onclick="cycleSpeed()" aria-label="調整速度">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m12 14 4-4"/>
      <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
    </svg>
    <span id="speedVal">1.0</span>
    <span class="btn-text">速度</span>
  </button>

  <button class="sm-btn" onclick="resetAll()" aria-label="重置">

  const numStr = String(localIdx + 1).padStart(2, '0');

}

  const curPoem = dataset[currentSentIdx].poem;
  POEMS.forEach((poem, i) => {
    const btn = document.getElementById('poemBtn' + i);
    const active = poem === curPoem;
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    btn.classList.toggle('active', active);
  });
}

function selectPoem(poemIdx) {
  const poem = POEMS[poemIdx];
  if (!poem || dataset[currentSentIdx].poem === poem) return;

  stopAudio();
  stopRecordPlayback();
  resumeAfterAction = false;
  resumeFromStart = false;

  currentSentIdx = dataset.findIndex(s => s.poem === poem);
  localStorage.setItem('poemIdx', String(poemIdx));
  renderSentence();
  requestAnimationFrame(fitFontSize);
  // 切換後若所選詩沒有「朗讀」音檔，自動跳回第一個音色
  if (sanitizeVoice()) {
    announce(`已切換至《${poem.title}》，此作品沒有朗讀音檔，已切回 ${currentVoice}`);
  } else {
    announce(`已切換至《${poem.title}》`);
  }
}

function updateVoiceLabel() {
  document.getElementById('voiceVal').textContent = currentVoice;
  document.getElementById('voiceBtn').setAttribute('aria-label',
    `音色，目前 ${currentVoice}，點擊切換`);
  // 無障礙模式＋真人朗讀音色：按鈕高亮，方便弱視學生判斷
  document.getElementById('voiceBtn').classList.toggle('voice-reciting',
    a11yMode && currentVoice === '朗讀');
}

function cycleVoice() {
  pauseForAction(true);
  stopAudio();
  const poem = dataset[currentSentIdx].poem;
  let next = voiceIdx;
  // 當前詩沒有朗讀音檔時，循環跳過「朗讀」
  for (let i = 0; i < VOICES.length; i++) {
    next = (next + 1) % VOICES.length;
    if (VOICES[next] !== '朗讀' || poemHasRecite(poem)) break;
  }
  voiceIdx = next;
  currentVoice = VOICES[voiceIdx];
  localStorage.setItem('voiceIdx', String(voiceIdx));
  updateVoiceLabel();
  if (resumeAfterAction) {
    resumeAfterAction = false;
    resumeFromStart = false;
    setTimeout(() => { togglePlayAudio(); }, 100);
  }
  announce(`已切換音色為 ${currentVoice}`);
}

// 目前詩沒有「朗讀」音檔時，把音色重置回第一個；回傳是否已變更
function sanitizeVoice() {
  const poem = dataset[currentSentIdx].poem;
  if (currentVoice === '朗讀' && !poemHasRecite(poem)) {
    voiceIdx = 0;
    currentVoice = VOICES[0];
    updateVoiceLabel();
    return true;
  }
  return false;
}

  const pw = document.querySelector('.para-wrap');

  const cmh = Math.max(window.innerHeight - cb.offsetHeight, need);
  document.documentElement.style.setProperty('--content-min-h', cmh + 'px');

    const visH = window.innerHeight - topBarH - cb.offsetHeight;
    const mt = Math.max(0, (visH - pw.offsetHeight) / 2);
    pw.style.marginTop = mt + 'px';
    pw.style.marginBottom = 'auto';
  }
}

// ============================================================
// 渲染
// ============================================================
function renderSentence() {
  const sent = dataset[currentSentIdx];
  const p = sent.poem;
  let html = `<div class="sentence-stage">`;
  // 頂部工具列顯示當前作品名（內容窗只留詩句，給文字最大空間）
  document.querySelector('.top-setting-bar h1').textContent = p.title;
  html += `<div class="para-holder"><div class="para-wrap sentence-active">`;
  sent.words.forEach((word) => {
    if (word.isPunc) {
      html += `<span class="punctuation">${word.h}</span>`;
    } else {
      html += `<ruby>${word.h}<rt>${word.p}</rt></ruby>`;
    }
  });
  html += `</div></div>`;
  html += `</div>`;
  container.innerHTML = html;

  document.getElementById('prevBtn').disabled = (currentSentIdx === 0);
  document.getElementById('nextBtn').disabled = (currentSentIdx === dataset.length - 1);

  bindRubyEvents();
  clearAllHighlight();
  updatePoemButtons();
}

// ============================================================
// 字卡事件
// ============================================================
function bindRubyEvents() {
  document.querySelectorAll('ruby').forEach(r => {
    r.addEventListener('click', (e) => {
      e.stopPropagation();
      if (touchMoved) return;
      r.classList.toggle('show-pinyin');
    });

    r.addEventListener('mouseenter', () => {
      if (a11yMode) r.classList.add('reading-now');
    });
    r.addEventListener('mouseleave', () => {
      if (a11yMode && !isPressing) r.classList.remove('reading-now');
    });

    r.addEventListener('mousedown', (e) => {
      if (!a11yMode) return;
      if (e.button !== 0) return;
      startLongPress(r);
    });
    r.addEventListener('mouseup', () => { endLongPress(); });

    r.addEventListener('touchstart', (e) => {
      if (!a11yMode) return;
      startLongPress(r);
    }, { passive: true });
    r.addEventListener('touchend', () => { endLongPress(); }, { passive: true });
    r.addEventListener('touchcancel', () => { endLongPress(); }, { passive: true });
  });
}

// ============================================================
// 字卡長按邏輯（從當前時間點續播）
// ============================================================
function startLongPress(r) {
  if (isPressing) return;
  pressTarget = r;
  longPressTimer = setTimeout(() => {
    isPressing = true;
    wasPlayingBeforePress = isPlaying;
    pauseAudio();
    r.classList.add('pressing', 'reading-now');
    if (navigator.vibrate) navigator.vibrate(30);
  }, LONG_PRESS_MS);
}

function endLongPress() {
  clearTimeout(longPressTimer);
  longPressTimer = null;
  pressTarget = null;

  if (isPressing) {
    isPressing = false;
    document.querySelectorAll('ruby.pressing').forEach(r => {
      r.classList.remove('pressing');
    });
    if (wasPlayingBeforePress) resumeAudio();
    wasPlayingBeforePress = false;
  }
}

// ============================================================
// 操作後續播輔助
// ============================================================
function pauseForAction(fromStart = true) {
  if (isPlaying) {
    resumeAfterAction = true;
    resumeFromStart = fromStart;
    pauseAudio();
  } else {
    resumeAfterAction = false;
    resumeFromStart = false;
  }
}

function resumeAfterActionIfNeeded() {
  if (!resumeAfterAction) return;
  resumeAfterAction = false;
  if (audio && resumeFromStart) audio.currentTime = 0;
  resumeFromStart = false;
  resumeAudio();
}

// ============================================================
// 播放 / 暫停 / 恢復
// ============================================================
function updatePlayIcon() {
  if (isPlaying) {
    playIcon.style.display = 'none';
    pauseIcon.style.display = '';
    playBtn.setAttribute('aria-label', '暫停');
  } else {
    playIcon.style.display = '';
    pauseIcon.style.display = 'none';
    playBtn.setAttribute('aria-label', '播放');
  }
}

function pauseAudio() {
  if (audio && isPlaying) {
    audio.pause();
    isPlaying = false;
    playBtn.classList.remove('playing');
    updatePlayIcon();
  }
}

function resumeAudio() {
  if (audio && !isPlaying) {
    audio.play().then(() => {
      isPlaying = true;
      playBtn.classList.add('playing');
      updatePlayIcon();
    }).catch(() => announce('恢復播放失敗'));
  }
}

function stopAudio() {
  if (audio) {
    audio.pause();
    audio.onended = null;
    audio.onerror = null;
    audio = null;
  }
  isPlaying = false;
  playBtn.classList.remove('playing');
  updatePlayIcon();
  clearAllHighlight();
}

function createAudioForCurrentSentence() {
  const sent = dataset[currentSentIdx];
  const fname = getAudioFilename(sent.localIdx, currentVoice);
  const fullPath = sent.poem.audioDir + fname;

  if (audio) {
    audio.onended = null;
    audio.onerror = null;
    audio.pause();
    audio = null;
  }

  audio = new Audio(fullPath);
  audio.playbackRate = speedRate;
  return audio;
}

function playNextInSequence() {
  const finishedSent = dataset[currentSentIdx];

  // 所屬詩篇播放完畢：自動停止，不續播下一篇
  if (finishedSent.localIdx === finishedSent.poem.sentences.length - 1) {
    isPlaying = false;
    playBtn.classList.remove('playing');
    updatePlayIcon();
    announce(`《${finishedSent.poem.title}》播放完畢`);
    return;
  }

  if (currentSentIdx >= dataset.length - 1) {
    isPlaying = false;
    playBtn.classList.remove('playing');
    updatePlayIcon();
    announce('全部段落播放完畢');
    return;
  }

  const finishedIdx = currentSentIdx;
  currentSentIdx++;
  renderSentence();
  requestAnimationFrame(fitFontSize);

  // 依作品文字檔的停頓標記決定下一句前等待時間；
  // 「朗讀」音色改用真人朗讀的句間停頓（recitePause），0 表示立即接下一句（無額外停頓）
  const sent = dataset[finishedIdx];
  let delay;
  if (currentVoice === '朗讀') {
    delay = Math.round((sent.poem.recitePause[sent.localIdx] || 0) * 1000);
  } else {
    delay = sent.pauseAfterMs;
    if (delay <= 0) {
      delay = (finishedIdx < dataset.length - 1) ? POEM_BOUNDARY_DELAY : INTER_SENTENCE_DELAY;
    }
  }

  setTimeout(() => {
    if (!isPlaying) return;

    createAudioForCurrentSentence();
    audio.onended = () => { playNextInSequence(); };
    audio.onerror = () => {
      announce(`音檔載入失敗`);
      isPlaying = false;
      playBtn.classList.remove('playing');
      updatePlayIcon();
    };

    audio.play().then(() => {
      announce(`播放第 ${currentSentIdx + 1} 段 ${currentVoice}`);
    }).catch(() => {
      announce('播放失敗');
      isPlaying = false;
      playBtn.classList.remove('playing');
      updatePlayIcon();
    });
  }, delay);
}

function togglePlayAudio() {
  if (isPlaying) {
    stopAudio();
    announce('暫停播放');
    return;
  }

  stopAudio();

  // 「朗讀」音色：單一原檔播放（currentTime 定位切句，背景音樂連續）
  if (currentVoice === '朗讀') {
    if (!poemHasRecite(dataset[currentSentIdx].poem)) {
      announce('此作品沒有朗讀音檔');
      return;
    }
    startRecitePlayback();
    return;
  }

  createAudioForCurrentSentence();

  audio.onended = () => { playNextInSequence(); };
  audio.onerror = () => {
    announce(`音檔載入失敗`);
    stopAudio();
  };

  audio.play().then(() => {
    isPlaying = true;
    playBtn.classList.add('playing');
    updatePlayIcon();
    announce(`播放第 ${currentSentIdx + 1} 段 ${currentVoice}`);
  }).catch(() => {
    announce('播放被瀏覽器攔截，請點擊頁面後再按播放');
  });
}

// 朗讀播放：單一完整原檔（00-朗誦.mp3），用 currentTime 定位切句；
// 首句起點含報題，其餘從該句字音起點開始；播到第 8 句末自動停止
function startRecitePlayback() {
  const poem = dataset[currentSentIdx].poem;
  const R = RECITE_MAP[poem.title];
  if (!R) { announce('此作品暫無朗讀音檔'); return; }
  if (audio) {
    audio.removeEventListener('timeupdate', reciteTimeUpdate);
    audio.onended = null;
    audio.onerror = null;
    audio.pause();
    audio = null;
  }
  audio = new Audio(poem.audioDir + '00-朗誦.mp3');
  audio.playbackRate = speedRate;
  const local = dataset[currentSentIdx].localIdx;
  audio.currentTime = (local === 0 ? 0 : R.SEEK[local]);
  // 首句：連續播完整檔；其他句（上/下句切換後）：只播當前句，播完即停
  reciteSingleMode = (local !== 0);
  audio.addEventListener('timeupdate', reciteTimeUpdate);
  audio.onended = () => { stopAudio(); announce(`《${poem.title}》朗讀播放完畢`); };
  audio.onerror = () => { announce('朗讀音檔載入失敗'); stopAudio(); };
  audio.play().then(() => {
    isPlaying = true;
    playBtn.classList.add('playing');
    updatePlayIcon();
    announce(`播放《${poem.title}》朗讀`);
  }).catch(() => {
    announce('播放被瀏覽器攔截，請點擊頁面後再按播放');
  });
}

// 朗讀播放中：單句模式播完當前句人聲即停；連續模式跟隨進度高亮（播完整檔含頭尾音樂）
function reciteTimeUpdate() {
  if (!audio || !isPlaying) return;
  const poem = dataset[currentSentIdx].poem;
  const R = RECITE_MAP[poem.title];
  if (!R) return;
  const firstIdx = dataset.findIndex(s => s.poem === poem);
  const t = audio.currentTime;
  if (reciteSingleMode) {
    const local = dataset[currentSentIdx].localIdx;
    const li = local + R.offset;
    // 停止點 = 字音終點 + 逐句尾音延長，但不侵入下一句首字（預留 0.05s 緩衝）
    const nextStart = (li + 1 < R.START.length) ? R.START[li + 1] : Infinity;
    const stopAt = Math.min(R.END[li] + R.TAIL[local], nextStart - 0.05);
    if (t >= stopAt) {
      stopAudio();
      announce(`第 ${currentSentIdx + 1} 句播放完畢`);
    }
    return;
  }
  let local = 0;
  for (let i = 0; i < R.SEEK.length; i++) {
    if (t >= R.SEEK[i]) local = i;
    else break;
  }
  const targetIdx = firstIdx + local;
  if (targetIdx !== currentSentIdx) {
    currentSentIdx = targetIdx;
    renderSentence();
    requestAnimationFrame(fitFontSize);
  }
}

// ============================================================
// 清除高亮
// ============================================================
function clearAllHighlight() {
  document.querySelectorAll('ruby.reading-now').forEach(r => {
    r.classList.remove('reading-now');
  });
}

// ============================================================
// 字體自適應
// ============================================================
function fitFontSize() {
  const words = dataset[currentSentIdx].words.length;
  const w = container.clientWidth;
  const h = container.clientHeight;
  if (w === 0 || h === 0) return;

  let size = 72;
  while (size > 20) {
    const charW = size * 1.45;   // 字卡等寬 1.35em＋間距，估算需同步
    const charsPerLine = Math.max(1, Math.floor(w / charW));
    const lines = Math.ceil(words / charsPerLine);
    const totalH = lines * size * 2.6;
    // 一般／無障礙模式統一使用最大字體（錄音鈕已移入控制列，不佔文字窗）
    const budget = h * 0.9 - 100;
    if (totalH <= Math.max(80, budget)) break;
    size -= 2;
  }
  document.documentElement.style.setProperty('--base-font-size', size + 'px');
}

if (window.ResizeObserver) {
  new ResizeObserver(() => fitFontSize()).observe(container);
}
window.addEventListener('resize', fitFontSize);
window.addEventListener('resize', positionFab);

// ============================================================
// 滑動手勢
// ============================================================
container.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
  touchStartTime = Date.now();
  touchMoved = false;
}, { passive: true });

container.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  const dy = Math.abs(e.touches[0].clientY - touchStartY);
  const dx = Math.abs(e.touches[0].clientX - touchStartX);
  if (dy > 10 || dx > 10) {
    touchMoved = true;
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}, { passive: true });

container.addEventListener('touchend', (e) => {
  const dt = Date.now() - touchStartTime;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dx = e.changedTouches[0].clientX - touchStartX;

  if (Math.abs(dx) > SWIPE_DISTANCE &&
      Math.abs(dy) < Math.abs(dx) * 0.5 &&
      dt < SWIPE_TIME) {
    if (dx < 0) nextSentence();
    else prevSentence();
    touchMoved = true;
  }

  setTimeout(() => { touchMoved = false; }, 100);
}, { passive: true });

// ============================================================
// 全域放開保險
// ============================================================
document.addEventListener('mouseup', () => { if (isPressing) endLongPress(); });
document.addEventListener('touchend', () => { if (isPressing) endLongPress(); });
document.addEventListener('touchcancel', () => { if (isPressing) endLongPress(); });

// ============================================================
// 句子切換
// ============================================================
function prevSentence() {
  // 朗讀播放中：時間跳轉到上一句（不中斷音樂）
  if (currentVoice === '朗讀' && isPlaying && audio) {
    const R = RECITE_MAP[dataset[currentSentIdx].poem.title];
    const local = dataset[currentSentIdx].localIdx;
    if (local <= 0) { announce('已經是本作品第一句'); return; }
    currentSentIdx--;
    renderSentence();
    requestAnimationFrame(fitFontSize);
    audio.currentTime = R.SEEK[dataset[currentSentIdx].localIdx];
    reciteSingleMode = true;   // 切句後只播當前句，播完即停
    announce(`切換到第 ${currentSentIdx + 1} 句`);
    return;
  }
  stopAudio();
  resumeAfterAction = false;
  resumeFromStart = false;
  if (currentSentIdx <= 0) { announce('已經是第一句'); return; }
  currentSentIdx--;
  renderSentence();
  requestAnimationFrame(fitFontSize);
  announce(`切換到第 ${currentSentIdx + 1} 句`);
}

function nextSentence() {
  // 朗讀播放中：時間跳轉到下一句（不中斷音樂）
  if (currentVoice === '朗讀' && isPlaying && audio) {
    const R = RECITE_MAP[dataset[currentSentIdx].poem.title];
    const local = dataset[currentSentIdx].localIdx;
    if (local >= dataset[currentSentIdx].poem.sentences.length - 1) {
      announce('已經是本作品最後一句');
      return;
    }
    currentSentIdx++;
    renderSentence();
    requestAnimationFrame(fitFontSize);
    audio.currentTime = R.SEEK[dataset[currentSentIdx].localIdx];
    reciteSingleMode = true;   // 切句後只播當前句，播完即停
    announce(`切換到第 ${currentSentIdx + 1} 句`);
    return;
  }
  stopAudio();
  resumeAfterAction = false;
  resumeFromStart = false;
  if (currentSentIdx >= dataset.length - 1) { announce('已經是最後一句'); return; }
  currentSentIdx++;
  renderSentence();
  requestAnimationFrame(fitFontSize);
  announce(`切換到第 ${currentSentIdx + 1} 句`);
}

// ============================================================
// 速度循環
// ============================================================
function cycleSpeed() {
  pauseForAction(true);
  speedPresetIdx = (speedPresetIdx + 1) % SPEED_PRESETS.length;
  speedRate = SPEED_PRESETS[speedPresetIdx];
  document.getElementById('speedVal').textContent = speedRate.toFixed(1);
  if (audio) audio.playbackRate = speedRate;
  setTimeout(() => { resumeAfterActionIfNeeded(); }, 100);
  announce(`播放速度 ${speedRate.toFixed(1)} 倍`);
}

// ============================================================
// 重置
// ============================================================
function resetAll() {
  stopAudio();
  stopRecordPlayback();
  resumeAfterAction = false;
  resumeFromStart = false;
  const curPoem = dataset[currentSentIdx].poem;
  currentSentIdx = dataset.findIndex(s => s.poem === curPoem);   // 保留當前作品，回到其第一句
  speedPresetIdx = 1;
  speedRate = 1.0;
  document.getElementById('speedVal').textContent = '1.0';
  renderSentence();
  requestAnimationFrame(fitFontSize);
  announce(`已重置，回到《${curPoem.title}》第一句`);
}

// ============================================================
// 錄音功能
// ============================================================
function updateRecordFabUI() {
  recordFab.classList.remove('recording', 'playing-back');

  if (recordState === 'recording') {
    // 錄音中：保留麥克風圖示，音量即時由右側音量柱呈現
    fabMicIcon.style.display = '';
    fabWaveIcon.style.display = 'none';
    recordFab.classList.add('recording');
    recordFab.setAttribute('aria-label', '錄音中，放開按鈕播放');

    fabWaveIcon.style.display = '';
    recordFab.classList.add('playing-back');
    recordFab.setAttribute('aria-label', '播放錄音中');

    fabMicIcon.style.display = '';
    fabWaveIcon.style.display = 'none';
    recordFab.setAttribute('aria-label', '按住錄音，放開播放');
  }
}

async function startPressRecording() {
  pressActive = true;

  // iOS Safari：在 user gesture 中播放無聲音頻解鎖，允許稍後播放錄音 blob
  try {
    const unlock = new Audio();
    unlock.src = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
    unlock.volume = 0.001;
    unlock.play().catch(() => {});
  } catch (unlockErr) { /* 可忽略 */ }

  // 錄音前先停止朗讀與舊錄音播放
  if (isPlaying) stopAudio();
  stopRecordPlayback();

  // 開始新錄音前，自動刪除舊錄音檔
  if (recordedUrl) {
    URL.revokeObjectURL(recordedUrl);
    recordedUrl = null;
    recordedBlob = null;
  }

  recordState = 'recording';
  updateRecordFabUI();

  try {
    const hasLiveStream = recordStream &&
                          recordStream.getAudioTracks().some(t => t.readyState === 'live');

    if (!hasLiveStream) {
      // 預檢權限：被瀏覽器封鎖時直接指引設定，不等待 getUserMedia 失敗
      try {
        if (navigator.permissions && navigator.permissions.query) {
          const st = await navigator.permissions.query({ name: 'microphone' });
          if (st.state === 'denied') {
            throw new Error('mic-perm-denied');
          }
        }
      } catch (permErr) {
        if (permErr && permErr.message === 'mic-perm-denied') {
          recordState = 'idle';
          try { stopVolumeMeter(); } catch (e2) {}
          try { updateRecordFabUI(); } catch (e2) {}
          showMicToast('麥克風權限已被封鎖：請在 Chrome 設定 → 網站設定 → 麥克風，改為「允許」後再試', 7000);
          return;
        }
        // permissions.query 本身不支援時忽略，繼續嘗試 getUserMedia
      }
      recordStream = await Promise.race([
        navigator.mediaDevices.getUserMedia({ audio: true }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('mic-timeout')), 8000))
      ]);
    }

    // 等待麥克風權限期間已放開按鈕 → 取消本次錄音
    if (!pressActive) {
      recordState = 'idle';
      updateRecordFabUI();
      return;
    }

    ensureAnalyser();
    sweepVolumeMeter(() => startVolumeMeter());

    let mimeType = '';
    if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
    else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
    else if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';

    const options = mimeType ? { mimeType } : {};
    mediaRecorder = new MediaRecorder(recordStream, options);
    recordedChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      if (discardAfterStop) {
        discardAfterStop = false;
        recordState = 'idle';
        updateRecordFabUI();
        return;
      }
      const chunksSize = recordedChunks.reduce((sum, b) => sum + b.size, 0);
      if (chunksSize === 0) {
        recordState = 'idle';
        updateRecordFabUI();
        showMicToast('錄音失敗（沒有錄到聲音），請再試一次', 4000);
        return;
      }
      const mrType = mediaRecorder && mediaRecorder.mimeType;
      recordedBlob = new Blob(recordedChunks, mrType ? { type: mrType.split(';')[0] } : undefined);
      if (recordedUrl && recordedUrl.startsWith('blob:')) URL.revokeObjectURL(recordedUrl);
      recordedUrl = URL.createObjectURL(recordedBlob);
      recordState = 'hasRecording';
      updateRecordFabUI();
      if (playAfterStop) {
        playAfterStop = false;
        playRecording();
      }
    };

    mediaRecorder.start();
    announce('開始錄音，放開按鈕播放');
  } catch (err) {
    console.error(err);
    recordState = 'idle';
    try { stopVolumeMeter(); } catch (e2) {}
    try { updateRecordFabUI(); } catch (e2) {}
    const name = err && err.name;
    const denied = (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError');
    showMicToast(denied ? '麥克風權限被拒：請在瀏覽器／手機設定中允許麥克風後重試' : '無法存取麥克風，請確認已允許麥克風權限', 6000);
  }
}

function finishPressRecording() {
  playAfterStop = false;
  pressActive = false;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    playAfterStop = true;
    mediaRecorder.stop();
  } else {
    recordState = 'idle';
    updateRecordFabUI();
  }
  stopVolumeMeter();
}

// ============================================================
// 音量柱（錄音時即時音量，多色：綠→黃→紅）
// ============================================================
function ensureAnalyser() {
  if (analyser) return analyser;
  if (!recordStream) return null;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(recordStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    src.connect(analyser);
  } catch (err) {
    console.error(err);
    return null;
  }
  return analyser;
}

function buildVolumeMeter() {
  volumeMeter.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const seg = document.createElement('div');
    seg.className = 'vol-seg';
    volumeMeter.appendChild(seg);
  }
  volSegs = volumeMeter.querySelectorAll('.vol-seg');
}

function setVolumeLevel(level) {
  const lit = Math.round(level * 10);
  volSegs.forEach((seg, i) => seg.classList.toggle('on', i < lit));
}

let sweepTimer = null;

// 啟動錄音：音量柱先由低爬到頂格，再回落，然後進入實時音量
function sweepVolumeMeter(done) {
  if (sweepTimer) clearInterval(sweepTimer);
  volumeMeter.classList.add('active');
  let step = 0;
  const frames = [];
  for (let i = 1; i <= 10; i++) frames.push(i / 10);
  for (let i = 9; i >= 0; i--) frames.push(i / 10);
  sweepTimer = setInterval(() => {
    if (step < frames.length) {
      setVolumeLevel(frames[step]);
      step++;
    } else {
      clearInterval(sweepTimer);
      sweepTimer = null;
      if (done) done();
    }
  }, 60);
}

function startVolumeMeter() {
  if (!ensureAnalyser()) return;
  volumeMeter.classList.add('active');
  const data = new Uint8Array(analyser.fftSize);
  const loop = () => {
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) {
      const v = (data[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / data.length);
    const level = Math.max(0, Math.min(1, rms * 3.5));
    setVolumeLevel(level < 0.03 ? 0 : level);
    volRaf = requestAnimationFrame(loop);
  };
  loop();
}

function stopVolumeMeter() {
  if (sweepTimer) { clearInterval(sweepTimer); sweepTimer = null; }
  volumeMeter.classList.remove('active');
  if (volRaf) {
    cancelAnimationFrame(volRaf);
    volRaf = null;
  }
  setVolumeLevel(0);
}

function playRecording() {
  if (!recordedUrl) {
    announce('沒有錄音可播放');
    recordState = 'idle';
    updateRecordFabUI();
    return;
  }
  if (isIOS) {
    // iOS：原生 Audio 元素 + blob URL（輕點 gesture 內播放，速度正常無雜音）
    // 失敗時後備 AudioContext 解碼播放
    playRecordingAudioEl({ fallbackCtx: true });
    return;
  }
  playRecordingAudioEl();
}

async function playRecordingViaCtx() {
  if (!recordedBlob) throw new Error('no-recording-blob');
  stopRecordPlayback();
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  const buf = await recordedBlob.arrayBuffer();
  const decoded = await audioCtx.decodeAudioData(buf);
  const src = audioCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(audioCtx.destination);
  src.onended = () => {
    if (recordCtxSrc === src) recordCtxSrc = null;
    recordState = 'hasRecording';
    updateRecordFabUI();
  };
  recordCtxSrc = src;
  recordState = 'playingBack';
  updateRecordFabUI();
  announce('播放您的錄音');
  src.start();
}

function playRecordingAudioEl(opts) {
  stopRecordPlayback();
  const fb = opts && opts.fallbackCtx;
  const fbFail = () => {
    showMicToast('播放錄音失敗，請再試一次', 4000);
    recordState = 'hasRecording';
    updateRecordFabUI();
  };
  recordAudioEl = new Audio(recordedUrl);
  recordAudioEl.onended = () => {
    recordState = 'hasRecording';
    updateRecordFabUI();
  };
  recordAudioEl.onerror = () => {
    if (fb) {
      playRecordingViaCtx().catch(fbFail);
      return;
    }
    fbFail();
  };
  recordAudioEl.play().then(() => {
    recordState = 'playingBack';
    updateRecordFabUI();
    announce('播放您的錄音');
  }).catch((err) => {
    console.error(err);
    if (fb) {
      playRecordingViaCtx().catch(fbFail);
      return;
    }
    showMicToast('自動播放被攔截：請輕點錄音鍵播放', 5000);
    recordState = 'hasRecording';
    updateRecordFabUI();
  });
}

function stopRecordPlayback() {
  if (recordAudioEl) {
    recordAudioEl.pause();
    recordAudioEl.onended = null;
    recordAudioEl.onerror = null;
    recordAudioEl = null;
  }
  if (recordCtxSrc) {
    try { recordCtxSrc.stop(); } catch (stopErr) {}
    recordCtxSrc = null;
  }
  if (recordState === 'playingBack') {
    recordState = 'hasRecording';
    updateRecordFabUI();
  }
}

// ============================================================
// 麥克風首次點擊預先授權
// 瀏覽器政策：getUserMedia 需在 user gesture 中請求，頁面載入自動請求會被拒。
// 首次點擊頁面任意處（非錄音鍵）時預先請求權限，允許後立即釋放；之後錄音不再彈權限窗。
// ============================================================
let micPreauthTried = false;
function preauthorizeMic(e) {
  if (micPreauthTried) return;
  const t = e.target;
  if (t && t.closest && t.closest('.record-fab')) return; // 錄音鍵自己處理
  micPreauthTried = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then((s) => { try { s.getTracks().forEach((tk) => tk.stop()); } catch (stopErr) {} })
    .catch(() => {});
}
document.addEventListener('pointerdown', preauthorizeMic);
document.addEventListener('touchstart', preauthorizeMic);

// ============================================================
// 錄音按鈕手勢（按住錄音、放開播放；新錄音自動覆蓋舊錄音）
// PointerEvent 主路徑＋後備：capture 容錯、全域 pointerup、無 PointerEvent 用 touch
// ============================================================
function cancelPressRecording() {
  mainPointerId = null;
  clearTimeout(tapTimer);
  tapTimer = null;
  tapPending = false;
  pressActive = false;
  playAfterStop = false;
  discardAfterStop = true;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  } else {
    recordState = 'idle';
    updateRecordFabUI();
  }
  stopVolumeMeter();
}

if (window.PointerEvent) {
  recordFab.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    mainPointerId = e.pointerId;
    try { recordFab.setPointerCapture(e.pointerId); } catch (err) { /* 舊瀏覽器可忽略 */ }
    pressStartTs = Date.now();
    if (recordState === 'hasRecording') {
      // 有舊錄音：輕點＝播放（iOS 點擊環境內播放），按住≥350ms＝重新錄音
      tapPending = true;
      tapTimer = setTimeout(() => {
        tapPending = false;
        startPressRecording();
      }, 350);
      return;
    }
    startPressRecording();
  });

  recordFab.addEventListener('pointerup', (e) => {
    if (e.pointerId !== mainPointerId) return;
    e.preventDefault();
    mainPointerId = null;
    clearTimeout(tapTimer);
    tapTimer = null;
    if (tapPending) {
      tapPending = false;
      playRecording();
      return;
    }
    finishPressRecording();
  });

  // 後備：capture 失敗或手指滑出按鈕時，全域 pointerup 也能結束
  document.addEventListener('pointerup', (e) => {
    if (e.pointerId !== mainPointerId) return;
    mainPointerId = null;
    clearTimeout(tapTimer);
    tapTimer = null;
    if (tapPending) {
      tapPending = false;
      playRecording();
      return;
    }
    finishPressRecording();
  });

  recordFab.addEventListener('pointercancel', cancelPressRecording);
} else {
  // 舊／內置瀏覽器（無 PointerEvent）：以觸控事件操作
  recordFab.addEventListener('touchstart', (e) => {
    e.preventDefault();
    pressStartTs = Date.now();
    if (recordState === 'hasRecording') {
      tapPending = true;
      tapTimer = setTimeout(() => {
        tapPending = false;
        startPressRecording();
      }, 350);
      return;
    }
    startPressRecording();
  }, { passive: false });
  recordFab.addEventListener('touchend', (e) => {
    e.preventDefault();
    clearTimeout(tapTimer);
    tapTimer = null;
    if (tapPending) {
      tapPending = false;
      playRecording();
      return;
    }
    finishPressRecording();
  }, { passive: false });
  recordFab.addEventListener('touchcancel', cancelPressRecording);
}

// ============================================================
// 頁面關閉時釋放麥克風串流
// ============================================================
window.addEventListener('beforeunload', () => {
  if (recordStream) {
    recordStream.getTracks().forEach(t => t.stop());
    recordStream = null;
  }
});

// ============================================================
// 事件監聽
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;

  switch (e.key) {
    case 'ArrowLeft': e.preventDefault(); prevSentence(); break;
    case 'ArrowRight': e.preventDefault(); nextSentence(); break;
    case ' ':
      e.preventDefault();
      togglePlayAudio();
      break;
    case 'Escape':
      e.preventDefault();
      resetAll();
      break;
  }
});

document.addEventListener('click', () => {
  document.querySelectorAll('ruby.show-pinyin').forEach(r => {
    r.classList.remove('show-pinyin');
  });
});

// ============================================================
// 初始化
// ============================================================
if (POEMS.length < 2) {
  // 只有一個作品時不顯示作品選擇按鈕
  const sel = document.querySelector('.poem-selector');
  if (sel) sel.style.display = 'none';
}
applyMode();
renderSentence();
fitFontSize();   // 同步首跑：保證第 1 句載入即正確字號（與其他句一致）
updatePlayIcon();
updateVoiceLabel();
buildVolumeMeter();
updateRecordFabUI();
positionFab();
requestAnimationFrame(() => {
  fitFontSize();
  positionFab();
  setTimeout(fitFontSize, 100);
});
window.addEventListener('load', () => { fitFontSize(); positionFab(); });
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { fitFontSize(); positionFab(); });
}
// 嘗試觸發 Android Chrome 收合網址欄，讓內容最大化（無害；不保證所有瀏覽器生效）
setTimeout(() => { try { window.scrollTo(0, 1); } catch (e) {} }, 500);
</script>
<script>
if ('serviceWorker' in navigator) {
  
// 不自動彈出安裝提示：由用戶自行從瀏覽器選單決定是否安裝／加到主螢幕
window.addEventListener('beforeinstallprompt', (e) => e.preventDefault());
window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));

// ===== 離線預載：後台下載全部音檔（完成時語音提示一次，不顯示文字） =====
async function preloadAllAudio() {
  if (!navigator.serviceWorker) return;
  const urls = [];
  POEMS.forEach((poem) => {
    const dir = new URL(poem.audioDir, location.href).href;
    const n = poem.sentences.length;
    ['Male-A', 'Male-B', 'Female-A'].forEach((v) => {
      for (let i = 1; i <= n; i++) urls.push(dir + String(i).padStart(2, '0') + '-' + v + '.mp3');
    });
    if (poem.hasRecite) urls.push(dir + '00-朗誦.mp3');
  });
  const list = [...new Set(urls)];
  if (!list.length) return;
  const BATCH = 6;
  for (let i = 0; i < list.length; i += BATCH) {
    await Promise.all(list.slice(i, i + BATCH).map((u) => fetch(u, { cache: 'no-cache' }).then((r) => r.ok).catch(() => false)));
  }
  try { announce('音檔已下載，可離線使用'); } catch (e) {}
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.ready.then(async () => {
    if (!navigator.serviceWorker.controller) {
      await new Promise((res) => {
        navigator.serviceWorker.addEventListener('controllerchange', res, { once: true });
        setTimeout(res, 10000);
      });
    }
    setTimeout(preloadAllAudio, 300);
  }).catch(() => {});
}

}
</script>
